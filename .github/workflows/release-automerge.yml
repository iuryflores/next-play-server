name: Aprovar e integrar release validada

on:
  workflow_run:
    workflows: ['CI, release e deploy NextPlay server']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: release-automerge-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'release-please--branches--main--components--nextplay-server'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Este workflow recebe secrets: executa apenas código da main, nunca do
      # PR nem de artefatos enviados por ele. Não instala dependências do PR.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - name: Conferir PR, aprovar e integrar o SHA validado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/release-automerge.mjs
