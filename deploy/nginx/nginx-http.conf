# Arquivo exclusivo do NextPlay. Não altera hosts nem certificados de outros sites.
log_format nextplay '$remote_addr [$time_local] "$request_method $server_protocol" $status $body_bytes_sent $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name nextplay.imjsistemas.com.br;
    access_log /var/log/nginx/nextplay-access.log nextplay;
    error_log /var/log/nginx/nextplay-error.log crit;
    server_tokens off;
    client_max_body_size 128k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nextplay-acme; }
    location ~ (^|/)\. { return 404; }
    location = /api { proxy_pass http://127.0.0.1:3111; include /etc/nginx/proxy_params; }
    location /api/ {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location /assets/ { proxy_pass http://127.0.0.1:3110; }
    location = /deploy-meta.json { proxy_pass http://127.0.0.1:3110; add_header Cache-Control no-store; }
    location = /index.html { proxy_pass http://127.0.0.1:3110; }
    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
